# BoT-SORT tuned for one fixed camera over an operating room where everyone
# wears the same gown. Ultralytics reads this file directly (mode="track").
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.35   # fewer spurious tracks from drapes/equipment
track_buffer: 90         # ~3 s at 30 fps; people are often occluded by each other
match_thresh: 0.8
fuse_score: True
gmc_method: none         # the camera does not move
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True          # appearance cue on top of motion
model: auto              # reuse detector features (no extra model download)
